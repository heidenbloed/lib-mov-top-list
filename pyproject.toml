[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project]
name = "lib_mov_top_list"
version = "0.1.0"
description = "Creates a Library Movies Top List."
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "heidenbloed", email = "69988488+heidenbloed@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = []
dependencies = ["requests>=2.32.5", "sruthi>=2.0.0"]

[dependency-groups]
dev = ["ruff>=0.14.14", "ty>=0.0.14", "prek>=0.1.0", "pysentry-rs>=0.1.0"]

[project.urls]
Homepage = "https://github.com/heidenbloed/lib-mov-top-list"
Documentation = "https://heidenbloed.github.io/lib-mov-top-list"
Repository = "https://github.com/heidenbloed/lib-mov-top-list"
Issues = "https://github.com/heidenbloed/lib-mov-top-list/issues"
Changelog = "https://github.com/heidenbloed/lib-mov-top-list/blob/main/CHANGELOG.md"

# =============================================================================
# Ruff
# =============================================================================

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["lib_mov_top_list"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]

# =============================================================================
# ty (Astral type checker)
# =============================================================================

[tool.ty.src]
include = ["**/*.py"]
